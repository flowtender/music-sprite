[project]
name = "music-sprite"
version = "0.1.0"
description = "Discord bot that downloads audio with yt-dlp, tags it, and adds it to a Navidrome library"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6",
    "yt-dlp",
    "mutagen>=1.47",
    "httpx>=0.27",
]

[project.scripts]
music-sprite = "music_sprite.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["music_sprite"]
