[project]
name = "music-sprite"
version = "0.1.0"
description = "Discord bot that downloads audio with yt-dlp, tags it, and adds it to a Navidrome library"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7",
    # curl-cffi: extractors such as Bandcamp's refuse to run without browser impersonation
    "yt-dlp[curl-cffi]",
    "mutagen>=1.47",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Tempo, key and genre analysis of the audio (about 300 MB with TensorFlow)
analysis = ["essentia-tensorflow"]
test = ["pytest", "numpy"]

[project.scripts]
music-sprite = "music_sprite.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["music_sprite"]
package-data = { music_sprite = ["assets/*.png"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
